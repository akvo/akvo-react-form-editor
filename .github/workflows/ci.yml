name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# CI never writes back to the repo; restrict the token to read-only.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Replaces the Semaphore `sed 's/"warn"/"error"/g' .eslintrc.json`
      # hack: --max-warnings=0 fails CI on any lint warning without
      # mutating the config file. Extra args are forwarded to the
      # existing `test:lint` script by yarn 1.x.
      - name: Lint (warnings fail the build)
        run: yarn test:lint --max-warnings=0

      - name: Prettier check
        run: yarn test:prettier

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

  # Build the Sphinx HTML purely as a break-check (never deployed),
  # reusing the exact image from docs/generate.sh. Running it via
  # `docker run` rather than a job-level `container:` mirrors
  # docs/generate.sh and avoids needing git inside the Sphinx image
  # for actions/checkout.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Sphinx docs (break-check)
        run: |
          docker run --rm -v "${{ github.workspace }}/docs:/docs" \
            akvo/akvo-sphinx:20220829.093307.b5bbf28 make html
