name: Deploy Pages

on:
  push:
    branches: [main]

# The official Pages actions need pages:write and id-token:write (OIDC).
# These are granted to the automatic GITHUB_TOKEN — no secret required.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; don't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      # Install root deps first so the example's linked dependency
      # (akvo-react-form-editor -> link:.. and react -> link:../node_modules)
      # resolves, then build the example app. Mirrors the existing
      # `predeploy` npm script.
      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Build example app
        run: |
          cd example
          yarn install
          yarn build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./example/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
